<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>秋醉福島・慢活七日｜極致舒適慢活版</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Chiron GoRound TC (body), Zen Maru Gothic (brand / tabs) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'benitobi': '#994639',       /* 紅鳶 BENITOBI (Nippon Colors col031) - 主色 */
                        'tobi': '#724832',           /* 鳶 TOBI (col043) - 按下與較深強調 */
                        'akakuchiba': '#C78550',     /* 赤朽葉 AKAKUCHIBA (col068) - 氣溫等點綴 */
                        'shironeri': '#FCFAF2',      /* 白練 SHIRONERI (col233) - 頁面底 */
                        'gofun': '#FFFFFB',          /* 胡粉 GOFUN (col234) - 紙面卡片 */
                        'kesizumi': '#434343',       /* 消炭 KESHIZUMI (col247) - 內文 */
                        'haizakura': '#D7C4BB',      /* 灰桜 HAIZAKURA (col026) - 分隔線 */
                        'ainezumi': '#566C73',       /* 藍鼠 AINEZUMI (col184) - 交通節點 */
                        'aoni': '#516E41',           /* 青丹 AONI (col146) - 住宿節點 */
                        'ohdo': '#B68E55',           /* 黄土 OHDO (col091) - 景點節點 */
                        /* 既有 class 對應新色，其餘天數暫不改結構 */
                        'benikaba': '#994639',
                        'benikaba-dark': '#724832',
                        'benikaba-light': '#FCFAF2',
                        'benikaba-soft': '#F3EDE6',
                        'yamabuki': '#C78550',
                        'akane': '#994639',
                        'kohaku': '#C78550',
                        'kuriume': '#724832',
                        'neriiro': '#FCFAF2',
                        'haiku': '#D7C4BB',
                        'wasen': '#724832',
                    },
                    fontFamily: {
                        'sans': ['"Chiron GoRound TC"', '"PingFang TC"', '"Hiragino Sans CNS"', '"Noto Sans TC"', '"Microsoft JhengHei"', 'sans-serif'],
                        'brand': ['"Zen Maru Gothic"', '"Chiron GoRound TC"', '"PingFang TC"', 'sans-serif'],
                        'serif': ['"Chiron GoRound TC"', '"PingFang TC"', 'serif'],
                        'mono': ['"Chiron GoRound TC"', '"PingFang TC"', '"Hiragino Sans CNS"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        :root {
            --font-sans: "Chiron GoRound TC", "PingFang TC", "Hiragino Sans CNS", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
            --font-brand: "Zen Maru Gothic", "Chiron GoRound TC", "PingFang TC", "Hiragino Sans CNS", sans-serif;
            --font-serif: "Chiron GoRound TC", "PingFang TC", "Songti TC", serif;
            --color-benitobi: #994639;
            --color-tobi: #724832;
            --color-kesizumi: #434343;
            --color-shironeri: #FCFAF2;
            --color-gofun: #FFFFFB;
            --color-haizakura: #D7C4BB;
            --color-transit: #566C73;
            --color-stay: #516E41;
            --color-spot: #B68E55;
            --mobile-nav-space: 0px;
            --text-xs: 0.75rem;
            --text-sm: 0.875rem;
            --text-base: 1rem;
            --text-md: 1.125rem;
            --text-lg: 1.25rem;
            --text-xl: 1.5rem;
            --text-2xl: 1.75rem;
            --leading-tight: 1.3;
            --leading-normal: 1.5;
            --leading-relaxed: 1.7;
            --weight-normal: 400;
            --weight-medium: 500;
            --weight-semibold: 600;
            --weight-bold: 700;
        }

        body {
            font-family: var(--font-sans);
            font-size: var(--text-base);
            line-height: var(--leading-normal);
            background-color: var(--color-shironeri);
            color: var(--color-kesizumi);
            -webkit-tap-highlight-color: transparent;
            overflow-x: hidden;
            padding-bottom: var(--mobile-nav-space);
        }

        .font-brand,
        .nav-tab-btn {
            font-family: var(--font-brand);
        }

        .serif,
        .font-num {
            font-family: var(--font-sans);
        }

        .trip-title {
            font-size: var(--text-2xl);
            font-weight: var(--weight-semibold);
            line-height: var(--leading-tight);
        }

        .text-kicker {
            font-size: var(--text-xs);
            line-height: var(--leading-tight);
        }

        .text-secondary {
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
        }

        body .text-secondary {
            color: rgba(67, 67, 67, 0.46);
        }

        .prose-narrow {
            max-width: 38rem;
            letter-spacing: 0.025em;
            line-height: var(--leading-relaxed);
        }

        .bg-pattern {
            background-image: radial-gradient(rgba(215, 196, 187, 0.42) 0.75px, transparent 0.75px);
            background-size: 1.75rem 1.75rem;
        }

        .btn-nav {
            transition: color 0.2s ease, border-color 0.2s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes fadeInRecord {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        #content-record.animate-fade-in {
            animation-name: fadeInRecord;
        }

        .expense-fab {
            box-shadow: 0 6px 16px rgba(153, 70, 57, 0.16);
        }

        #content-record .expense-fab {
            bottom: calc(var(--mobile-nav-space, 0px) + 1.25rem);
        }

        @media (min-width: 768px) {
            #content-record .expense-fab {
                bottom: 2.5rem;
            }
        }

        .expense-sheet-form {
            display: flex;
            flex-direction: column;
            gap: 1.15rem;
            padding-bottom: 0.25rem;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .ph-duotone {
            --ph-duotone-opacity: 0.28;
            vertical-align: middle;
        }

        #content-itinerary .ph-duotone {
            --ph-duotone-opacity: 0.4;
            vertical-align: middle;
        }

        #content-itinerary .itin-actions .ph-duotone {
            font-size: 1rem;
            line-height: 1;
            color: inherit;
        }

        #content-itinerary .day-climate .ph-duotone {
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .timeline-line {
            position: absolute;
            left: calc(var(--itin-time-col) + var(--itin-time-gap) * 0.5);
            top: 1.6rem;
            bottom: 1.25rem;
            width: 1px;
            background: rgba(215, 196, 187, 0.42);
            transform: translateX(-50%);
        }

        .itin-list {
            --itin-time-col: 3.5rem;
            --itin-time-gap: 1.25rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .itin-item {
            display: grid;
            grid-template-columns: var(--itin-time-col) minmax(0, 1fr);
            column-gap: var(--itin-time-gap);
            align-items: start;
        }

        .itin-time {
            font-variant-numeric: tabular-nums;
            font-weight: var(--weight-medium);
            color: var(--color-benitobi);
            font-size: var(--text-xs);
            letter-spacing: 0;
            line-height: var(--leading-tight);
            text-align: right;
            padding-top: 1.2rem;
            padding-right: 0;
        }

        .itin-card {
            position: relative;
            background: var(--color-gofun);
            border: 0.5px solid rgba(215, 196, 187, 0.5);
            border-radius: 0.75rem;
            box-shadow: none;
            padding: 1.15rem 1.2rem 1.05rem;
            width: 100%;
            max-width: none;
            min-width: 0;
        }

        .itin-card-head {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
        }

        .itin-icon {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 1.5rem;
            height: 1.52rem;
            font-size: 1.25rem;
            line-height: 1;
            color: var(--color-benitobi);
        }

        .itin-card-copy {
            flex: 1;
            min-width: 0;
        }

        .itin-card-title-row {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.6rem;
        }

        .itin-card-title-row .item-title {
            flex: 1 1 auto;
            min-width: 0;
        }

        #content-itinerary .amount,
        .itin-amount {
            flex-shrink: 0;
            font-size: var(--text-sm);
            font-weight: var(--weight-semibold);
            line-height: var(--leading-tight);
            font-variant-numeric: tabular-nums;
            letter-spacing: 0;
            white-space: nowrap;
        }

        .itin-sub {
            margin-top: 0.35rem;
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
        }

        .itin-fact {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 0.75rem;
            margin-top: 0.85rem;
            font-size: var(--text-base);
            font-weight: var(--weight-medium);
            line-height: var(--leading-normal);
        }

        .itin-fact > :first-child {
            min-width: 0;
            flex: 1 1 auto;
        }

        .itin-note {
            margin-top: 0.55rem;
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
        }

        .itin-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.95rem;
        }

        #content-itinerary .itin-actions .btn-outline {
            width: auto;
            min-width: 0;
            min-height: 2.25rem;
            padding: 0.3rem 0.85rem;
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            line-height: var(--leading-tight);
            border-width: 1px;
        }

        .itin-bulb {
            flex-shrink: 0;
            width: 2.25rem;
            height: 2.25rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: -0.2rem -0.35rem -0.2rem 0;
            border: 0;
            border-radius: 9999px;
            background: transparent;
            color: var(--color-ohdo);
            font-size: 1.25rem;
            line-height: 1;
            cursor: pointer;
            opacity: 0.88;
        }

        .itin-bulb:hover,
        .itin-bulb:focus-visible {
            opacity: 1;
            color: var(--color-spot);
            background: rgba(182, 142, 85, 0.1);
        }

        .itin-bulb:focus-visible {
            outline: 2px solid var(--color-benitobi);
            outline-offset: 2px;
        }

        .day-climate {
            position: relative;
        }

        @media (min-width: 768px) {
            .itin-list {
                --itin-time-col: 4.25rem;
                --itin-time-gap: 1.35rem;
                gap: 1.5rem;
            }

            .itin-time {
                padding-top: 1.35rem;
            }

            .itin-card {
                padding: 1.35rem 1.4rem 1.15rem;
            }
        }

        @media (min-width: 1024px) {
            .itin-list {
                --itin-time-col: 4.75rem;
                --itin-time-gap: 1.85rem;
            }
        }

        .itin-sheet {
            position: fixed;
            inset: 0;
            z-index: 80;
            visibility: hidden;
            pointer-events: none;
        }

        .itin-sheet.is-open {
            visibility: visible;
            pointer-events: auto;
        }

        .itin-sheet-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(67, 67, 67, 0.28);
            opacity: 0;
            transition: opacity 0.32s ease;
        }

        .itin-sheet.is-open .itin-sheet-backdrop {
            opacity: 1;
        }

        .itin-sheet-panel {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            max-height: min(78vh, 42rem);
            overflow: auto;
            background: var(--color-gofun);
            border: 0.5px solid rgba(215, 196, 187, 0.5);
            border-bottom: 0;
            border-radius: 1rem 1rem 0 0;
            box-shadow: none;
            padding: 0.65rem 1.5rem calc(1.5rem + env(safe-area-inset-bottom, 0px));
            transform: translateY(100%);
            transition: transform 0.42s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .itin-sheet.is-open .itin-sheet-panel {
            transform: translateY(0);
        }

        .itin-sheet-handle {
            width: 2.5rem;
            height: 3px;
            border-radius: 999px;
            background: rgba(215, 196, 187, 0.9);
            margin: 0.2rem auto 0.85rem;
        }

        .itin-sheet-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: 1rem;
        }

        .itin-sheet-header h3 {
            font-size: var(--text-md);
            font-weight: var(--weight-medium);
            line-height: var(--leading-tight);
            color: var(--color-kesizumi);
        }

        .itin-sheet-close {
            flex-shrink: 0;
            width: 2.75rem;
            height: 2.75rem;
            border: 0;
            background: none;
            color: var(--color-kesizumi);
            font-size: 1.35rem;
            line-height: 1;
            cursor: pointer;
        }

        .itin-sheet-kicker {
            display: none;
        }

        .itin-sheet-label {
            margin: 1.15rem 0 0.45rem;
            font-size: var(--text-xs);
            font-weight: var(--weight-medium);
            line-height: var(--leading-tight);
            letter-spacing: 0.08em;
            color: rgba(67, 67, 67, 0.46);
        }

        .itin-sheet-list {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            padding: 0;
            margin: 0;
            list-style: none;
        }

        .itin-sheet-list li {
            position: relative;
            padding-left: 0.9rem;
            font-size: var(--text-base);
            line-height: var(--leading-relaxed);
            color: var(--color-kesizumi);
        }

        .itin-sheet-list li::before {
            content: "";
            position: absolute;
            left: 0;
            top: 0.65em;
            width: 0.28rem;
            height: 0.28rem;
            border-radius: 999px;
            background: var(--color-benitobi);
        }

        body.itin-sheet-open,
        body.expense-sheet-open,
        body.souvenir-sheet-open,
        body.souvenir-photo-open {
            overflow: hidden;
        }

        @media (min-width: 768px) {
            .itin-sheet-panel {
                left: 50%;
                right: auto;
                width: 90%;
                max-width: 42rem;
                border-bottom: 0.5px solid rgba(215, 196, 187, 0.5);
                border-radius: 1rem 1rem 0 0;
                transform: translate(-50%, 100%);
            }

            .itin-sheet.is-open .itin-sheet-panel {
                transform: translate(-50%, 0);
            }
        }

        .nav-tab-btn {
            color: var(--color-kesizumi);
            font-size: var(--text-sm);
            font-weight: var(--weight-medium);
            line-height: var(--leading-tight);
        }

        .nav-tab-btn.is-active {
            color: var(--color-benitobi);
            font-weight: var(--weight-bold);
        }

        .nav-desktop .nav-tab-btn {
            border-bottom: 2px solid transparent;
            min-height: 2.75rem;
        }

        .nav-desktop .nav-tab-btn.is-active {
            border-bottom-color: var(--color-benitobi);
        }

        .nav-mobile {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        .nav-mobile-inner {
            display: flex;
            flex-wrap: nowrap;
        }

        .nav-mobile .nav-tab-btn {
            flex: 1 1 0;
            min-width: 0;
            min-height: 2.75rem;
            padding: 0.4rem 0.2rem;
            white-space: nowrap;
        }

        .day-scroller {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: stretch;
            gap: 0.25rem;
            min-width: 0;
        }

        .subtab-btn {
            flex: 1 1 0;
            min-width: 0;
            max-width: 5.5rem;
            min-height: 4.25rem;
            padding: 0.4rem 0.15rem 0.35rem;
            color: var(--color-kesizumi);
            background-color: var(--color-gofun);
            border-color: var(--color-haizakura);
            font-weight: var(--weight-medium);
            font-size: var(--text-sm);
            line-height: var(--leading-tight);
            white-space: nowrap;
            border-radius: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.15rem;
        }

        .subtab-btn .date-num {
            font-size: var(--text-xs);
            font-weight: var(--weight-semibold);
            letter-spacing: 0.01em;
        }

        .subtab-btn .date-weekday {
            font-size: var(--text-xs);
            font-weight: var(--weight-medium);
            opacity: 0.72;
        }

        .subtab-btn.active .date-weekday {
            opacity: 0.92;
        }

        .subtab-btn.active {
            color: var(--color-gofun);
            background-color: var(--color-benitobi);
            border-color: var(--color-benitobi);
            font-weight: var(--weight-bold);
        }

        .today-mark {
            display: none;
            font-size: var(--text-xs);
            font-weight: var(--weight-medium);
            line-height: var(--leading-tight);
            letter-spacing: 0.04em;
        }

        .subtab-btn.is-today .today-mark {
            display: block;
        }

        .subtab-btn.is-today:not(.active) .today-mark {
            color: var(--color-benitobi);
        }

        details.quiet-details > summary {
            cursor: pointer;
            list-style: none;
            min-height: 2.75rem;
            display: inline-flex;
            align-items: center;
        }

        details.quiet-details > summary::-webkit-details-marker {
            display: none;
        }

        .day-climate {
            position: relative;
        }

        .day-sheet,
        .page-sheet,
        .item-card,
        .option-block {
            background: var(--color-gofun);
            border: 0.5px solid rgba(215, 196, 187, 0.5);
            box-shadow: none;
        }

        .day-sheet,
        .page-sheet {
            border-radius: 1rem;
            overflow-wrap: anywhere;
            min-width: 0;
            padding: 1.75rem;
        }

        @media (min-width: 640px) {
            .day-sheet,
            .page-sheet {
                padding: 2.5rem;
            }
        }

        .prose-narrow {
            overflow-wrap: anywhere;
            min-width: 0;
        }

        .option-block,
        .item-card {
            overflow-wrap: anywhere;
            min-width: 0;
            max-width: 100%;
        }

        .page-head {
            padding-bottom: 1.75rem;
            margin-bottom: 2.5rem;
            border-bottom: 0.5px solid rgba(215, 196, 187, 0.5);
        }

        .page-title {
            font-size: var(--text-xl);
            font-weight: var(--weight-semibold);
            line-height: var(--leading-tight);
            color: var(--color-kesizumi);
            border-left: 2px solid var(--color-benitobi);
            padding-left: 1rem;
        }

        .item-title {
            font-size: var(--text-md);
            font-weight: var(--weight-medium);
            line-height: var(--leading-tight);
            color: var(--color-kesizumi);
        }

        .btn-primary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            min-height: 2.75rem;
            min-width: 2.75rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            background: var(--color-benitobi);
            color: var(--color-gofun);
            font-weight: var(--weight-medium);
            line-height: var(--leading-normal);
            white-space: normal;
            text-align: center;
        }

        .btn-outline {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            width: 100%;
            min-height: 2.75rem;
            min-width: 2.75rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--color-benitobi);
            background: transparent;
            color: var(--color-benitobi);
            font-weight: var(--weight-medium);
            line-height: var(--leading-normal);
            white-space: normal;
            text-align: center;
        }

        .btn-outline:hover {
            background: rgba(153, 70, 57, 0.06);
        }

        .btn-primary:hover {
            background: var(--color-tobi);
        }

        .btn-secondary {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.375rem;
            min-height: 2.75rem;
            min-width: 2.75rem;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--color-haizakura);
            background: var(--color-gofun);
            color: var(--color-kesizumi);
            font-weight: var(--weight-medium);
            line-height: var(--leading-normal);
            white-space: normal;
            text-align: center;
        }

        .btn-secondary:hover {
            background: var(--color-shironeri);
        }

        .btn-danger {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 2.75rem;
            min-width: 2.75rem;
            padding: 0.25rem;
            border-radius: 0.5rem;
            color: var(--color-kesizumi);
        }

        .btn-primary,
        .btn-outline,
        .btn-secondary {
            font-size: var(--text-sm);
        }

        .notice {
            display: flex;
            align-items: flex-start;
            gap: 0.625rem;
            font-size: var(--text-sm);
            line-height: var(--leading-relaxed);
            color: var(--color-kesizumi);
        }

        .notice.is-alert {
            color: #6B4F2A;
        }

        function resolvedEventPrice(event) {
            if (event.price) return event.price;
            const service = getService(event.serviceId);
            if (service && service.price) return service.price;
            const pricedChild = eventChildren(event).find((child) => child.price);
            return pricedChild ? pricedChild.price : null;
        }

        function resolvedEventCoverage(event) {
            if (event.coverage && event.coverage.label) return event.coverage;
            const service = getService(event.serviceId);
            if (service && service.coverage) return service.coverage;
            const child = eventChildren(event).find((item) => item.coverage && item.coverage.label);
            return child ? child.coverage : null;
        }

        function isShortDuration(duration) {
            if (!duration) return false;
            const match = String(duration).match(/(\d+(?:\.\d+)?)\s*分/);
            if (!match) return false;
            const minutes = Number(match[1]);
            return minutes > 0 && minutes <= 10;
        }

        function eventWeight(event) {
            if (event.type === 'service') return 'compact';
            if (event.type === 'flight' || event.type === 'sightseeing' || event.type === 'activity' || event.type === 'meal' || event.type === 'stop' || event.type === 'flexible') {
                return 'major';
            }
            if (event.type === 'movement') {
                if (['train', 'shinkansen', 'bus', 'limousine', 'shuttle', 'charter'].includes(event.mode)) {
                    return 'major';
                }
                if (event.serviceName) return 'major';
                if (event.mode === 'walk') return 'compact';
                if (event.mode === 'taxi' && isShortDuration(event.duration)) return 'compact';
                return 'major';
            }
            return 'major';
        }

        function weatherReminderText(day) {
            const reminders = {
                1: '早晚偏冷，建議洋蔥式穿搭。',
                2: '山區偏冷，請著防風保暖外套。',
                3: '早晚偏冷，建議洋蔥式穿搭。',
                4: '早晚偏涼，記得加件外套。',
                5: '清晨步道可能結霜，備妥保暖防滑。',
                6: '山區到市區溫差大，建議洋蔥式穿搭。',
                7: '回程偏暖，厚外套可收進行李。'
            };
            return reminders[day.day] || '';
        }

        function eventIconName(event) {
            if (event.icon && ITINERARY_ICON[event.icon]) return ITINERARY_ICON[event.icon];
            if (event.type === 'flight') return ITINERARY_ICON.flight;
            if (event.type === 'movement') return ITINERARY_ICON[event.mode] || ITINERARY_ICON.walk;
            if (event.type === 'meal') {
                return event.meal && (event.meal.resolution === 'bento' || event.meal.subtype === 'station_bento') ? ITINERARY_ICON.bento : ITINERARY_ICON.meal;
            }
            if (event.type === 'service') return ITINERARY_ICON.service;
            if (event.type === 'activity') return ITINERARY_ICON[event.icon] || ITINERARY_ICON.activity;
            if (event.type === 'flexible') return ITINERARY_ICON[event.icon] || ITINERARY_ICON.shopping;
            return ITINERARY_ICON[event.icon] || ITINERARY_ICON.sightseeing;
        }

        function eventTitle(event) {
            if (event.title) return event.title;
            if (event.type === 'flight') {
                const seg = getFlightSegment(event.flightSegmentId);
                if (seg) return seg.departure.airportCode + ' → ' + seg.arrival.airportCode;
            }
            if (event.type === 'movement' || (event.type === 'service' && event.fromPlaceId && event.toPlaceId && !event.title)) {
                const from = getPlace(event.fromPlaceId);
                const to = getPlace(event.toPlaceId);
                return ((from && from.name) || '') + ' → ' + ((to && to.name) || '');
            }
            if (event.type === 'meal' && event.meal) {
                const slot = ITINERARY_MEAL_LABEL[event.meal.slot] || '用餐';
                if (isOpenMeal(event)) {
                    const area = mealAreaLabel(event);
                    return area ? slot + '｜' + area : slot;
                }
                const place = getPlace(event.placeId);
                if ((event.meal.resolution === 'restaurant' || event.meal.resolution === 'bento') && place && place.name) {
                    return place.name;
                }
                return slot;
            }
            const place = getPlace(event.placeId);
            if (place && place.name) return place.name;
            return ITINERARY_TYPE_LABEL[event.type] || '';
        }

        function eventHasSheet(event) {
            const service = getService(event.serviceId);
            return Boolean(
                eventHasExtension(event) ||
                isOpenMeal(event) ||
                eventOptions(event).length ||
                (event.details && event.details.length) ||
                (event.unresolved && event.unresolved.length) ||
                event.baggage ||
                event.operationalCondition ||
                (service && service.details && service.details.length) ||
                eventChildren(event).some((child) => eventHasSheet(child))
            );
        }

        function flattenDayItems(day) {
            const items = [];
            (day.preBoundary || []).forEach((event) => items.push({ zone: 'pre', event }));
            (day.timeline || []).forEach((event) => items.push({ zone: 'timeline', event }));
            (day.postBoundary || []).forEach((event) => items.push({ zone: 'post', event }));
            return items;
        }

        function addOneIsoDate(iso) {
            const parts = String(iso).split('-').map(Number);
            const utc = Date.UTC(parts[0], parts[1] - 1, parts[2] + 1);
            const dt = new Date(utc);
            const y = dt.getUTCFullYear();
            const m = String(dt.getUTCMonth() + 1).padStart(2, '0');
            const d = String(dt.getUTCDate()).padStart(2, '0');
            return y + '-' + m + '-' + d;
        }

        function civilStamp(dateIso, time) {
            if (!dateIso || !time || !/^\d{1,2}:\d{2}$/.test(time)) return null;
            const dp = dateIso.split('-').map(Number);
            const tp = time.split(':').map(Number);
            return Date.UTC(dp[0], dp[1] - 1, dp[2], tp[0], tp[1]);
        }

        function eventTimeRange(day, event) {
            const startDate = event.startDate || day.date;
            let endDate = event.endDate || startDate;
            const start = civilStamp(startDate, event.startTime);
            let end = civilStamp(endDate, event.endTime);
            if (start != null && end != null && end <= start && !event.endDate) {
                endDate = addOneIsoDate(endDate);
                end = civilStamp(endDate, event.endTime);
            }
            return { start, end, startDate, endDate };
        }

        function getTokyoWallNow(now = new Date()) {
            const fmt = new Intl.DateTimeFormat('en-CA', {
                timeZone: TRIP_TIME_ZONE,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            });
            const parts = fmt.formatToParts(now);
            const get = (type) => (parts.find((part) => part.type === type) || {}).value;
            const date = get('year') + '-' + get('month') + '-' + get('day');
            const time = get('hour') + ':' + get('minute');
            return { date, time, stamp: civilStamp(date, time) };
        }

        function resolveCurrentEventState(now = new Date()) {
            const wall = getTokyoWallNow(now);
            if (!wall.stamp || wall.date < TRIP_START || wall.date > TRIP_END) {
                return { currentId: '', nextId: '' };
            }
            const day = ITINERARY.days.find((item) => item.date === wall.date);
            if (!day) return { currentId: '', nextId: '' };
            const timed = flattenDayItems(day)
                .map(({ event }) => ({ event, range: eventTimeRange(day, event) }))
                .filter((row) => row.range.start != null);
            let currentId = '';
            let nextId = '';
            timed.forEach((row, index) => {
                const { event, range } = row;
                const nextStart = timed[index + 1] ? timed[index + 1].range.start : null;
                const end = range.end != null ? range.end : nextStart;
                if (!currentId && wall.stamp >= range.start && (end == null || wall.stamp < end)) {
                    currentId = event.id;
                }
                if (!nextId && range.start > wall.stamp) {
                    nextId = event.id;
                }
            });
            return { currentId, nextId };
        }

        function itinActionButton(href, icon, label) {
            return `<a href="${escapeHtml(href)}" target="_blank" rel="noopener" class="btn-outline"><i class="ph-duotone ${icon}" aria-hidden="true"></i> ${escapeHtml(label)}</a>`;
        }

        function eventActionsHtml(event) {
            const buttons = [];
            if (isOpenMeal(event)) {
                buttons.push(
                    `<button type="button" class="btn-outline" data-itin-sheet data-itin-event="${escapeHtml(event.id)}">查看餐廳推薦</button>`
                );
            } else if (event.type === 'flexible' && eventOptions(event).length) {
                buttons.push(
                    `<button type="button" class="btn-outline" data-itin-sheet data-itin-event="${escapeHtml(event.id)}">查看選項</button>`
                );
            }
            if (event.type === 'flight') {
                const seg = getFlightSegment(event.flightSegmentId);
                const flightNo = seg ? seg.flightNo : '';
                if (flightNo) {
                    buttons.push(itinActionButton(
                        'https://www.google.com/search?q=' + encodeURIComponent(flightNo + ' status'),
                        'ph-airplane-in-flight',
                        '航班動態'
                    ));
                }
            }
            if (event.type === 'movement') {
                const from = getPlace(event.fromPlaceId);
                const to = getPlace(event.toPlaceId);
                const origin = placeMapQuery(from);
                const dest = placeMapQuery(to);
                if (origin && dest) {
                    buttons.push(itinActionButton(
                        mapsDirUrl(origin, dest, event.travelMode || 'transit'),
                        'ph-navigation-arrow',
                        '導航'
                    ));
                }
            } else if (event.type !== 'flight' && !isOpenMeal(event)) {
                const place = getPlace(event.placeId);
                const skipHotelService = event.type === 'service' && place && place.type === 'accommodation';
                const query = placeMapQuery(place);
                if (query && !skipHotelService) {
                    buttons.push(itinActionButton(mapsSearchUrl(query), 'ph-map-pin', '地點資訊'));
                }
            }
            if (event.bookingId) {
                const booking = getBooking(event.bookingId);
                if (booking && booking.href && booking.channelLabel) {
                    buttons.push(itinActionButton(booking.href, 'ph-arrow-square-out', booking.channelLabel));
                }
            }
            const hasSheetEntry = isOpenMeal(event) || (event.type === 'flexible' && eventOptions(event).length) || eventHasExtension(event);
            if (eventHasSheet(event) && !hasSheetEntry) {
                buttons.push(
                    `<button type="button" class="btn-outline" data-itin-sheet data-itin-event="${escapeHtml(event.id)}">詳情</button>`
                );
            }
            return buttons.length ? `<div class="itin-actions">${buttons.join('')}</div>` : '';
        }

        function eventSubline(event) {
            if (event.type === 'flight') {
                const seg = getFlightSegment(event.flightSegmentId);
                if (!seg) return '';
                const dep = [seg.departure.airportCode, seg.departure.terminal].filter(Boolean).join(' ');
                const arr = [seg.arrival.airportCode, seg.arrival.terminal].filter(Boolean).join(' ');
                const bits = [(seg.airline || '') + ' ' + seg.flightNo, dep + ' → ' + arr];
                if (event.baggage) bits.push('行李 ' + event.baggage);
                return bits.filter(Boolean).join('　');
            }
            if (event.type === 'movement') {
                const mode = ITINERARY_MODE_LABEL[event.mode] || '';
                const bits = [mode, event.serviceName, event.duration].filter(Boolean);
                return bits.join('　');
            }
            if (event.type === 'service' && event.fromPlaceId && event.toPlaceId) {
                const from = getPlace(event.fromPlaceId);
                const to = getPlace(event.toPlaceId);
                return [from && from.name, to && to.name].filter(Boolean).join(' → ');
            }
            if (event.type === 'stop') {
                return eventChildren(event).map((child) => {
                    if (child.type === 'meal' && child.meal) return child.title || ITINERARY_MEAL_LABEL[child.meal.slot] || '用餐';
                    return child.title || (getPlace(child.placeId) && getPlace(child.placeId).name) || '';
                }).filter(Boolean).join(' ＋ ');
            }
            if (event.type === 'meal') {
                if (isOpenMeal(event)) return '';
                const slot = event.meal ? ITINERARY_MEAL_LABEL[event.meal.slot] : '';
                const place = getPlace(event.placeId);
                const area = event.areaLabel || (place && place.area) || (place && place.name) || '';
                if (event.meal && event.meal.subtype === 'station_bento') return [slot, '站內便當'].filter(Boolean).join('｜');
                if (event.title) return [slot, area].filter((bit, i, arr) => bit && arr.indexOf(bit) === i).join('｜');
                if (slot && area) return slot + '｜' + area;
                return event.stay || area || slot || '';
            }
            const bits = [];
            if (event.stay) bits.push(event.stay);
            if (event.duration) bits.push(event.duration);
            if (event.distance) bits.push(event.distance);
            if (event.route) bits.push(event.route);
            if (event.serviceName) bits.push(event.serviceName);
            return bits.join('　');
        }

        function eventFactHtml(event, ctx) {
            const rows = [];
            const coverage = resolvedEventCoverage(event);
            if (coverage && coverage.label) {
                rows.push(`<p class="itin-fact"><span class="itin-coverage">${escapeHtml(coverage.label)}</span></p>`);
            }
            const booking = getBooking(event.bookingId);
            const status = bookingStatusLabel(booking);
            const shown = ctx && ctx.shownBookings;
            if (status && booking && booking.status === 'to-book' && shown && !shown.has(booking.id)) {
                shown.add(booking.id);
                rows.push(`<p class="itin-fact"><span class="itin-status">${escapeHtml(status)}</span></p>`);
            }
            return rows.join('');
        }

        function timeColumnHtml(event) {
            if (!event.startTime) {
                return `<p class="itin-time">${event.timeLabel ? escapeHtml(event.timeLabel) : ''}</p>`;
            }
            const end = event.endTime && event.endTime !== event.startTime
                ? `<span class="itin-time-end">${escapeHtml(event.endTime)}</span>`
                : '';
            return `<p class="itin-time">${escapeHtml(event.startTime)}${end}</p>`;
        }

        function eventCardHtml(day, event, progress, ctx) {
            const title = eventTitle(event);
            const price = formatItinPrice(resolvedEventPrice(event));
            const sub = eventSubline(event);
            const weight = eventWeight(event);
            const isCurrent = progress.currentId === event.id;
            const isNext = progress.nextId === event.id;
            const itemClass = ['itin-item'];
            if (weight === 'compact') itemClass.push('is-compact');
            if (isCurrent) itemClass.push('is-current');
            if (isNext) itemClass.push('is-next');
            const cardClass = ['itin-card'];
            const bulb = eventHasExtension(event)
                ? `<button type="button" class="itin-bulb" data-itin-sheet data-itin-event="${escapeHtml(event.id)}" aria-label="${eventHasNotes(event) ? '提醒' : '備案'}"><i class="ph-duotone ph-lightbulb" aria-hidden="true"></i></button>`
                : '';
            const priceHtml = price ? `<p class="amount text-benitobi itin-amount">${escapeHtml(price)}</p>` : '';
            return `
                <article class="${itemClass.join(' ')}" id="itin-${escapeHtml(event.id)}" data-event-id="${escapeHtml(event.id)}">
                    ${timeColumnHtml(event)}
                    <div class="${cardClass.join(' ')}">
                        <div class="itin-card-head">
                            <i class="ph-duotone ${eventIconName(event)} itin-icon" aria-hidden="true"></i>
                            <div class="itin-card-copy">
                                <div class="itin-card-title-row">
                                    <h3 class="item-title">${escapeHtml(title)}</h3>
                                    ${priceHtml}
                                    ${bulb}
                                </div>
                                ${sub ? `<p class="text-secondary itin-sub">${escapeHtml(sub)}</p>` : ''}
                                ${eventFactHtml(event, ctx)}
                                ${eventActionsHtml(event)}
                            </div>
                        </div>
                    </div>
                </article>
            `;
        }

        function sheetList(items) {
            if (!items || !items.length) return '';
            return `<ul class="itin-sheet-list">${items.map((item) => `<li>${item}</li>`).join('')}</ul>`;
        }

        function alternativeText(alt) {
            if (typeof alt === 'string') return alt;
            const trigger = alt.trigger ? alt.trigger + '：' : '';
            return trigger + (alt.summary || '');
        }

        function optionHtml(opt) {
            const place = opt.placeId ? getPlace(opt.placeId) : null;
            const name = opt.name || (place && place.name) || '';
            const note = opt.note ? '　' + opt.note : '';
            return '<span class="font-medium">' + escapeHtml(name) + '</span>' + escapeHtml(note);
        }

        function buildEventSheetHtml(day, event) {
            const blocks = [];
            const seg = event.flightSegmentId ? getFlightSegment(event.flightSegmentId) : null;
            if (seg) {
                blocks.push('<p class="itin-sheet-label">航班</p>');
                const flightBits = [
                    escapeHtml([seg.airline, seg.flightNo].filter(Boolean).join(' ')),
                    escapeHtml(seg.departure.airportCode + ' ' + (seg.departure.terminal || '') + ' ' + seg.departure.time + ' → ' + seg.arrival.airportCode + ' ' + (seg.arrival.terminal || '') + ' ' + seg.arrival.time)
                ];
                if (event.baggage) flightBits.push(escapeHtml('行李 ' + event.baggage));
                blocks.push(sheetList(flightBits));
            }
            const booking = event.bookingId ? getBooking(event.bookingId) : null;
            if (booking) {
                const place = getPlace(booking.placeId);
                const bits = [];
                if (booking.title) bits.push(escapeHtml(booking.title));
                const status = bookingStatusLabel(booking);
                if (status) bits.push(escapeHtml(status));
                if (booking.channelLabel) bits.push(escapeHtml(booking.channelLabel));
                if (place && place.phone) {
                    const tel = place.tel || place.phone;
                    bits.push(`<a href="tel:${escapeHtml(tel)}">${escapeHtml(place.phone)}</a>`);
                }
                if (bits.length) {
                    blocks.push('<p class="itin-sheet-label">預訂</p>');
                    blocks.push(sheetList(bits));
                }
            }
            const service = getService(event.serviceId);
            if (service) {
                const bits = [];
                if (service.deliveryTiming) bits.push(escapeHtml(service.deliveryTiming));
                if (service.bookingRequired) bits.push('需向飯店櫃台辦理。');
                (service.details || []).forEach((item) => bits.push(escapeHtml(item)));
                if (bits.length) {
                    blocks.push('<p class="itin-sheet-label">服務</p>');
                    blocks.push(sheetList(bits));
                }
            }
            if (event.operationalCondition) {
                blocks.push('<p class="itin-sheet-label">營運條件</p>');
                blocks.push(sheetList([escapeHtml(event.operationalCondition)]));
            }
            const restaurantOptions = eventOptions(event).filter((opt) => opt.kind === 'restaurant' || !opt.kind);
            const otherOptions = eventOptions(event).filter((opt) => opt.kind && opt.kind !== 'restaurant');
            if (restaurantOptions.length) {
                blocks.push('<p class="itin-sheet-label">餐廳推薦</p>');
                blocks.push(sheetList(restaurantOptions.map(optionHtml)));
            }
            if (otherOptions.length) {
                blocks.push('<p class="itin-sheet-label">推薦</p>');
                blocks.push(sheetList(otherOptions.map(optionHtml)));
            }
            const alts = visibleAlternatives(event);
            if (alts.length) {
                blocks.push('<p class="itin-sheet-label">備案</p>');
                blocks.push(sheetList(alts.map((item) => escapeHtml(alternativeText(item)))));
            }
            const details = [];
            (event.details || []).forEach((item) => details.push(escapeHtml(item)));
            eventChildren(event).forEach((child) => {
                (child.details || []).forEach((item) => details.push(escapeHtml(item)));
            });
            if (details.length) {
                blocks.push('<p class="itin-sheet-label">細節</p>');
                blocks.push(sheetList(details));
            }
            const notes = eventNotes(event);
            if (notes.length) {
                blocks.push('<p class="itin-sheet-label">提醒</p>');
                blocks.push(sheetList(notes.map((item) => escapeHtml(item))));
            }
            const unresolved = collectEventList(event, 'unresolved');
            if (unresolved.length) {
                blocks.push(`<p class="itin-unresolved">${unresolved.map((item) => escapeHtml(item)).join('<br>')}</p>`);
            }
            if (!blocks.length) {
                blocks.push('<p class="text-secondary">沒有更多細節。</p>');
            }
            return blocks.join('');
        }

        function buildDaySheetHtml(day) {
            return '';
        }

        function anchorHtml(day, anchor, role) {
            if (!anchor) return '';
            const place = getPlace(anchor.placeId) || {};
            const seg = anchor.flightSegmentId ? getFlightSegment(anchor.flightSegmentId) : null;
            const booking = anchor.bookingId ? getBooking(anchor.bookingId) : null;
            let kicker = anchor.kicker;
            if (!kicker) {
                if (role === 'start' && anchor.kind === 'airport') kicker = '今日起點';
                else if (role === 'end' && anchor.kind === 'airport') kicker = '今日終點';
                else if (role === 'start') kicker = '今日起點';
                else kicker = '今晚住宿';
            }
            const meta = [];
            if (anchor.time) meta.push(anchor.time);
            if (seg) {
                if (anchor.role === 'arrival') meta.push('抵達');
                if (anchor.role === 'departure') meta.push('前往登機');

            if (booking && role === 'end') {
                const nights = nightsBetween(booking.checkIn, booking.checkOut);
                if (day.date === booking.checkIn) meta.push('入住');
                else if (nights > 1) meta.push('連泊');

            const timeLabel = anchor.time || (seg && (anchor.role === 'arrival' ? seg.arrival.time : seg.departure.time)) || '';

                <div class="itin-anchor-block">

                    <div class="itin-anchor-body">
                        <p class="itin-anchor-kicker">${escapeHtml(kicker)}</p>
                        <p class="itin-anchor-name">${escapeHtml(place.name || '')}</p>
                        ${meta.length ? `<p class="text-secondary itin-anchor-meta">${escapeHtml(meta.join('　'))}</p>` : ''}
                    </div>
                </div>
            `;
        }

        function weatherIcon(day) {

        function renderDayHtml(day, progress) {

                                    <span>${escapeHtml((day.weather && day.weather.text) || '')}</span>
                                </p>
                                ${reminder ? `<p class="day-climate-reminder">${escapeHtml(reminder)}</p>` : ''}
                            </div>
                        </div>
                    </div>
                    <div class="day-timeline">
                        <div class="timeline-list itin-list">
                            <div class="timeline-line" aria-hidden="true"></div>
                            ${preItems.map((row) => eventCardHtml(day, row.event, progress, ctx)).join('')}
                            ${anchorHtml(day, day.startAnchor, 'start')}

        function formatDisplayDate(dateStr) {
            return toDateInputValue(dateStr).replace(/-/g, '/');

        function toDateInputValue(dateStr) {
            const fallback = formatExpenseDate();
            if (!dateStr) return fallback;
            const parts = String(dateStr).trim().split(/[./-]/).map(Number).filter((n) => !Number.isNaN(n));
            if (parts.length === 3 && parts[0] > 31) {
                const [y, m, d] = parts;
                return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            }
            if (parts.length === 3) {
                const [d, m, y] = parts[0] > 12 ? parts : [parts[1], parts[0], parts[2]];
                return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            }
            if (parts.length === 2) {
                const [m, d] = parts;
                const tokyoYear = Number(formatExpenseDate().slice(0, 4));
                return `${tokyoYear}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
            }
            return fallback;
        }

        function fromDateInputValue(iso) {

        function createExpenseId() {

        function compareExpensesDesc(a, b) {
            const dateCmp = toDateInputValue(b.date).localeCompare(toDateInputValue(a.date));
            if (dateCmp !== 0) return dateCmp;
            return String(b.createdAt || '').localeCompare(String(a.createdAt || ''));
        }

        function resolvePayerName(exp) {
            if (Object.prototype.hasOwnProperty.call(exp, 'payerName')) {
                return String(exp.payerName || '').trim();
            }
            if (exp.payerParticipantId) {
                return LEGACY_PAYER_NAMES_BY_ID[exp.payerParticipantId] || '';
            }

        }

        function createParticipantId() {
            const raw = crypto.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`;
            return `p-${String(raw).replace(/-/g, '').slice(0, 12)}`;
        }

        function buildExportParticipants(expenseList) {
            const names = [];
            const seen = new Set();
            (expenseList || []).forEach((exp) => {
                const payerName = String(exp.payerName || '').trim();
                if (!payerName || seen.has(payerName)) return;
                seen.add(payerName);
                names.push(payerName);
            });
            return names.map((name) => ({
                id: createParticipantId(),
                name,
                type: 'traveler'
            }));
        }

        function expenseNeedsPersist(raw, next) {
            if (!raw || typeof raw !== 'object' || !next) return true;
            if ('item' in raw || 'amount' in raw || 'payerParticipantId' in raw) return true;
            return [
                'id',
                'name',
                'category',
                'date',
                'currency',
                'exchangeRateToTwd',
                'amountOriginal',
                'payerName',
                'createdAt',
                'updatedAt'
            ].some((key) => raw[key] !== next[key]);
        }

        function normalizeExpense(exp) {
            if (!exp || typeof exp !== 'object') return null;
            const sourceName = exp.name != null ? String(exp.name) : String(exp.item || '');
            const ntMatch = sourceName.match(/^(.*) \(NT\$(\d+)\)$/);
            let name = ntMatch ? ntMatch[1] : sourceName;
            let currency = exp.currency === 'TWD' ? 'TWD' : 'JPY';
            let amountOriginal = Number(exp.amountOriginal != null ? exp.amountOriginal : exp.amount);
            if (!Number.isFinite(amountOriginal)) amountOriginal = 0;
            if (currency !== 'TWD' && ntMatch) {
                name = ntMatch[1];
                amountOriginal = Number(ntMatch[2]) || 0;
                currency = 'TWD';
            } else if (currency === 'TWD' && ntMatch) {
                name = ntMatch[1];
                if (!amountOriginal) amountOriginal = Number(ntMatch[2]) || 0;
            }
            if (!TRIP_CURRENCY_CONFIG.allowedCurrencies.includes(currency)) {
                currency = TRIP_CURRENCY_CONFIG.defaultCurrency;
            }
            const categoryRaw = exp.category === '宿泊' ? '住宿' : (exp.category || '雜支');
            const category = EXPENSE_CATEGORY_MAP[categoryRaw] ? categoryRaw : '雜支';
            const nowIso = new Date().toISOString();
            const exchangeRateToTwd = exp.exchangeRateToTwd == null || exp.exchangeRateToTwd === ''
                ? null
                : Number(exp.exchangeRateToTwd);
            return {
                id: exp.id != null && String(exp.id) !== '' ? String(exp.id) : createExpenseId(),
                name,
                category,
                date: toDateInputValue(exp.date),
                currency,
                exchangeRateToTwd: Number.isFinite(exchangeRateToTwd) ? exchangeRateToTwd : null,
                amountOriginal,
                payerName: resolvePayerName(exp),
                createdAt: exp.createdAt || nowIso,
                updatedAt: exp.updatedAt || exp.createdAt || nowIso
            };
        }

        class ExpenseStore {
            async loadExpenses() { throw new Error('Not implemented'); }
            async getExpense() { throw new Error('Not implemented'); }
            async addExpense() { throw new Error('Not implemented'); }
            async updateExpense() { throw new Error('Not implemented'); }
            async deleteExpense() { throw new Error('Not implemented'); }
            async replaceExpenses() { throw new Error('Not implemented'); }
            async clearExpenses() { throw new Error('Not implemented'); }
            async exportExpenses() { throw new Error('Not implemented'); }
        }

        class LocalStorageExpenseStore extends ExpenseStore {
            constructor(storageKey = EXPENSE_STORAGE_KEY) {
                super();
                this.storageKey = storageKey;
            }

            readAll() {
                try {
                    const raw = localStorage.getItem(this.storageKey);
                    if (!raw) return { expenses: [], migrated: false };
                    const parsed = JSON.parse(raw);
                    if (!Array.isArray(parsed)) return { expenses: [], migrated: false };
                    let migrated = false;
                    const expenses = parsed.map((item) => {
                        const next = normalizeExpense(item);
                        if (!next) return null;
                        if (expenseNeedsPersist(item, next)) migrated = true;
                        return next;
                    }).filter(Boolean);
                    expenses.sort(compareExpensesDesc);
                    return { expenses, migrated };
                } catch (error) {
                    console.error('[ExpenseStore] load failed', error);
                    return { expenses: [], migrated: false };
                }
            }

            writeAll(expenses) {
                try {
                    localStorage.setItem(this.storageKey, JSON.stringify(expenses));
                } catch (error) {
                    console.error('[ExpenseStore] save failed', error);
                    throw error;
                }
            }

            async loadExpenses() {
                const { expenses, migrated } = this.readAll();
                if (migrated) this.writeAll(expenses);
                return expenses.slice();
            }

            async getExpense(id) {
                const expenses = await this.loadExpenses();
                return expenses.find((exp) => String(exp.id) === String(id)) || null;
            }

            async addExpense(expense) {
                const { expenses } = this.readAll();
                const nowIso = new Date().toISOString();
                const record = normalizeExpense({
                    ...expense,
                    id: createExpenseId(),
                    createdAt: nowIso,
                    updatedAt: nowIso
                });
                if (!record || !record.name || !(record.amountOriginal > 0)) {
                    throw new Error('Invalid expense');
                }
                expenses.push(record);
                expenses.sort(compareExpensesDesc);
                this.writeAll(expenses);
                return record;
            }

            async updateExpense(id, patch) {
                const { expenses } = this.readAll();
                const idx = expenses.findIndex((exp) => String(exp.id) === String(id));
                if (idx < 0) throw new Error('Expense not found: ' + id);
                const current = expenses[idx];
                const record = normalizeExpense({
                    ...current,
                    ...patch,
                    id: current.id,
                    createdAt: current.createdAt,
                    updatedAt: new Date().toISOString()
                });
                if (!record || !record.name || !(record.amountOriginal > 0)) {
                    throw new Error('Invalid expense');
                }
                expenses[idx] = record;
                expenses.sort(compareExpensesDesc);
                this.writeAll(expenses);
                return record;
            }

            async deleteExpense(id) {
                const { expenses } = this.readAll();
                this.writeAll(expenses.filter((exp) => String(exp.id) !== String(id)));
                return true;
            }

            async replaceExpenses(nextExpenses) {
                const expenses = (Array.isArray(nextExpenses) ? nextExpenses : [])
                    .map(normalizeExpense)
                    .filter(Boolean)
                    .sort(compareExpensesDesc);
                this.writeAll(expenses);
                return expenses.slice();
            }

            async clearExpenses() {
                this.writeAll([]);
                return [];
            }

            async exportExpenses() {
                const expenses = await this.loadExpenses();
                const participants = buildExportParticipants(expenses);
                const payerIdByName = new Map(participants.map((p) => [p.name, p.id]));
                return {
                    tripId: TRIP_CONFIG.tripId,
                    tripName: TRIP_CONFIG.tripName,
                    defaultCurrency: TRIP_CURRENCY_CONFIG.defaultCurrency,
                    startDate: TRIP_CONFIG.startDate,
                    endDate: TRIP_CONFIG.endDate,
                    season: 'autumn',
                    version: 1,
                    timeZone: TRIP_CONFIG.timeZone,
                    allowedCurrencies: TRIP_CURRENCY_CONFIG.allowedCurrencies.slice(),
                    rates: [],
                    participants,
                    receipts: [],
                    expenses: expenses.map((exp, index) => ({
                        id: exp.id,
                        tripId: TRIP_CONFIG.tripId,
                        receiptId: null,
                        receiptItemId: null,
                        name: exp.name,
                        category: mapExpenseCategory(exp.category),
                        date: toDateInputValue(exp.date),
                        currency: exp.currency,
                        exchangeRateToTwd: exp.exchangeRateToTwd,
                        amountOriginal: Number(exp.amountOriginal) || 0,
                        itemQuantity: null,
                        unitPriceOriginal: null,
                        payerParticipantId: payerIdByName.get(String(exp.payerName || '').trim()) || '',
                        allocationMode: 'single_person',
                        sortOrder: index,
                        createdByUserId: null,
                        updatedByUserId: null,
                        createdAt: exp.createdAt,
                        updatedAt: exp.updatedAt,
                        allocations: []
                    })),
                    paymentStatus: {}
                };
            }
        }

        async function addExpense() {
            const itemInput = document.getElementById('expense-item');
            const amountInput = document.getElementById('expense-amount');
            const dateInput = document.getElementById('expense-date');
            const currencySelect = document.getElementById('expense-currency');
            const categoryInput = document.getElementById('selected-category');
            const payerInput = document.getElementById('expense-payer');

            const name = itemInput.value.trim();
            const amountOriginal = parseInt(amountInput.value, 10);
            const date = fromDateInputValue(dateInput && dateInput.value);
            const currency = currencySelect.value === 'TWD' ? 'TWD' : 'JPY';
            const category = categoryInput.value || '雜支';
            const payerName = payerInput ? payerInput.value.trim() : '';

            if (!name || isNaN(amountOriginal) || amountOriginal <= 0) {
                alert('請輸入有效項目名稱與金額');
                return;
            }
            if (!dateInput || !dateInput.value) {
                alert('請選擇日期');
                return;
            }
            if (!TRIP_CURRENCY_CONFIG.allowedCurrencies.includes(currency)) {
                alert('請選擇有效幣別');
                return;
            }

            const payload = { name, amountOriginal, currency, category, date, payerName };

            try {
                if (editingExpenseId != null) {
                    await expenseStore.updateExpense(editingExpenseId, payload);
                } else {
                    await expenseStore.addExpense(payload);
                }
                lastPayerName = payerName;
                await refreshExpenses();
                closeExpenseSheet();
            } catch (error) {
                console.error('[ExpenseStore] save expense failed', error);
                alert('儲存失敗，請稍後再試');
            }
        }

        async function deleteExpense(id) {
            if (!confirm('確定要刪除這筆紀錄嗎？')) return;
            try {
                await expenseStore.deleteExpense(id);
                await refreshExpenses();
            } catch (error) {
                console.error('[ExpenseStore] delete expense failed', error);
                alert('刪除失敗，請稍後再試');
            }
        }

        async function exportLedgerJson() {
            try {
                const payload = await expenseStore.exportExpenses();
                const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `${TRIP_CONFIG.tripId}-ledger.json`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                URL.revokeObjectURL(url);
            } catch (error) {
                console.error('[ExpenseStore] export failed', error);
                alert('匯出失敗，請稍後再試');
            }
        }

        function escapeHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function migratePrepState(parsed) {
            const checked = parsed.checked && typeof parsed.checked === 'object' ? Object.assign({}, parsed.checked) : {};
            if (checked['passport-check'] && !checked['pack-passport']) {
                checked['pack-passport'] = true;
            }
            const rawCustom = Array.isArray(parsed.customItems)
                ? parsed.customItems
                : (Array.isArray(parsed.customPacking) ? parsed.customPacking : []);
            const customItems = rawCustom
                .filter((item) => item && item.id && item.title)
                .map((item) => ({
                    id: String(item.id),
                    category: 'custom',
                    title: String(item.title),
                    note: item.note ? String(item.note) : '',
                    custom: true,
                    source: 'custom'
                }));
            return {
                version: PREP_STORAGE_VERSION,
                checked,
                customItems,
                openCards: parsed.openCards && typeof parsed.openCards === 'object' ? parsed.openCards : {}
            };
        }

        function loadPrepState() {
            try {
                const raw = localStorage.getItem(PREP_STORAGE_KEY);
                if (!raw) {
                    prepState = { version: PREP_STORAGE_VERSION, checked: {}, customItems: [], openCards: {} };
                    return;
                }
                prepState = migratePrepState(JSON.parse(raw));
            } catch (e) {
                prepState = { version: PREP_STORAGE_VERSION, checked: {}, customItems: [], openCards: {} };
            }
        }

        function savePrepState() {
            localStorage.setItem(PREP_STORAGE_KEY, JSON.stringify({
                version: PREP_STORAGE_VERSION,
                checked: prepState.checked,
                customItems: prepState.customItems,
                openCards: prepState.openCards || {}
            }));
        }

        function prepItemHtml(item, canDelete) {
            const checked = !!prepState.checked[item.id];
            const detail = item.reason || item.note;
            const note = detail ? `<p class="prep-note">${escapeHtml(detail)}</p>` : '';
            const link = item.href
                ? `<a href="${escapeHtml(item.href)}" target="_blank" rel="noopener" class="prep-link">${escapeHtml(item.linkLabel || '開啟連結')} <i class="ph ph-arrow-square-out" aria-hidden="true"></i></a>`
                : '';
            const del = canDelete
                ? `<button type="button" class="btn-danger" data-prep-delete="${escapeHtml(item.id)}" aria-label="刪除 ${escapeHtml(item.title)}"><i class="ph ph-trash text-lg" aria-hidden="true"></i></button>`
                : '';
            return `
                <div class="prep-item${checked ? ' is-done' : ''}">
                    <label class="prep-check-wrap">
                        <input type="checkbox" data-prep-id="${escapeHtml(item.id)}" ${checked ? 'checked' : ''} aria-label="${escapeHtml(item.title)}">
                        <span class="prep-check" aria-hidden="true"><i class="ph ph-check"></i></span>
                    </label>
                    <div class="prep-body">
                        <p class="prep-title">${escapeHtml(item.title)}</p>
                        ${note}
                        ${link}
                    </div>
                    ${del}
                </div>
            `;
        }

        function renderPrepCategory(category) {
            const root = document.getElementById('prep-list-' + category);
            if (!root) return;
            const items = getPrepItemsByCategory(category);
            root.innerHTML = items.map((item) => prepItemHtml(item, category === 'custom')).join('');

            event.preventDefault();
            const input = document.getElementById('prep-add-input');
            const title = (input.value || '').trim();
            if (!title) return;
            prepState.customItems.push({
                id: 'custom-' + Date.now(),
                category: 'custom',
                title,
                note: '',
                custom: true,
                source: 'custom'
            });
            savePrepState();
            const card = document.querySelector('details.prep-card[data-prep-category="custom"]');
            if (card) card.open = true;
            if (!prepState.openCards) prepState.openCards = {};
            prepState.openCards.custom = true;
            savePrepState();
            renderPrepCategory('custom');
            input.value = '';
            input.focus();
        }

        function bindPrepLists() {
            const root = document.getElementById('content-prep');
            if (!root || root.dataset.prepBound === '1') return;
            root.dataset.prepBound = '1';
            root.addEventListener('change', (event) => {
                const input = event.target.closest('input[data-prep-id]');
                if (!input) return;
                prepState.checked[input.dataset.prepId] = input.checked;
                savePrepState();
                const item = input.closest('.prep-item');
                if (item) item.classList.toggle('is-done', input.checked);
            });
            root.addEventListener('click', (event) => {
                const btn = event.target.closest('[data-prep-delete]');
                if (!btn) return;
                const itemId = btn.dataset.prepDelete;
                prepState.customItems = prepState.customItems.filter((item) => item.id !== itemId);
                delete prepState.checked[itemId];
                savePrepState();
                renderPrepCategory('custom');
            });
            root.addEventListener('toggle', (event) => {
                const card = event.target;
                if (!card.matches || !card.matches('details.prep-card[data-prep-category]')) return;
                if (!prepState.openCards) prepState.openCards = {};
                prepState.openCards[card.dataset.prepCategory] = card.open;
                savePrepState();
            }, true);
        }

        function applyPrepCardOpenState() {
            document.querySelectorAll('details.prep-card[data-prep-category]').forEach((card) => {
                card.open = !!(prepState.openCards && prepState.openCards[card.dataset.prepCategory]);
            });
        }

        const SOUVENIR_NOTES = [
            {
                id: 'note-takkyubin',
                icon: 'ph-suitcase-simple',
                title: '善用宅急便寄大行李',
                body: '會津若松退房時把大行李寄往裏磐梯レイクリゾート，大內宿與塔崖輕裝走最輕鬆。'

                body: '裏磐梯溫泉水熬製的會津山鹽數量珍稀，購買相關商品時認明「會津山塩認定シール」貼紙。'
