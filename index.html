            }
        ];
        let souvenirState = { version: SOUVENIR_STORAGE_VERSION, items: [] };
        let souvenirView = 'recommend';
        let souvenirFilter = 'all';
        let souvenirSheetLastFocus = null;
        let souvenirPhotoDraft = '';

        function souvenirStorageKey() {
            return TRIP_CONFIG.tripId + '_souvenirs';
        }

        function getItineraryDays() {
            return Array.isArray(TRIP_CONFIG.days) ? TRIP_CONFIG.days : [];
        }

        function getItineraryDay(dayNum) {
            const n = Number(dayNum);
            return getItineraryDays().find((day) => day.day === n) || null;
        }

        function formatSouvenirDayPlace(dayNum, placeLabel) {
            const day = Number(dayNum);
            const place = (placeLabel || '').trim();
            if (!day && !place) return '';
            if (!place) return 'Day ' + day;
            return 'Day ' + day + '｜' + place;
        }

        function formatSouvenirPrice(amount, note) {
            if (amount == null || amount === '') {
                return note ? '參考價格　' + note : '';
            }
            const n = Number(amount);
            const yen = '¥' + n.toLocaleString();
            return '參考價格 ' + yen + ' 起';
        }

        function findSouvenirRecommendation(id) {
            return SOUVENIR_RECOMMENDATIONS.find((item) => item.id === id) || null;
        }

        function isRecommendationInMine(recId) {
            return souvenirState.items.some((item) => item.recommendationId === recId);
        }

        function findSouvenirItem(id) {
            return souvenirState.items.find((item) => item.id === id) || null;
        }

        function locationsToText(locations) {
            if (Array.isArray(locations)) return locations.filter(Boolean).join('\n');
            return locations ? String(locations) : '';
        }

        function textToLocations(text) {
            return String(text || '')
                .split(/\n|、/)
                .map((line) => line.trim())
                .filter(Boolean);
        }

        function loadSouvenirState() {
            try {
                const raw = localStorage.getItem(souvenirStorageKey());
                if (!raw) {
                    souvenirState = { version: SOUVENIR_STORAGE_VERSION, items: [] };
                    return;
                }
                const parsed = JSON.parse(raw);
                const items = Array.isArray(parsed.items) ? parsed.items : [];
                souvenirState = {
                    version: SOUVENIR_STORAGE_VERSION,
                    items: items.filter((item) => item && item.id && item.name).map((item) => ({
                        id: String(item.id),
                        source: item.source === 'recommendation' ? 'recommendation' : 'custom',
                        recommendationId: item.recommendationId || null,
                        name: String(item.name),
                        brand: item.brand ? String(item.brand) : '',
                        forWhom: item.forWhom ? String(item.forWhom) : '',
                        quantity: Math.max(1, Number(item.quantity) || 1),
                        referencePrice: item.referencePrice == null || item.referencePrice === '' ? '' : item.referencePrice,
                        priceNote: item.priceNote ? String(item.priceNote) : '',
                        purchaseLocations: Array.isArray(item.purchaseLocations) ? item.purchaseLocations.map(String) : textToLocations(item.purchaseLocations),
                        note: item.note ? String(item.note) : '',
                        relatedDay: item.relatedDay ? Number(item.relatedDay) : null,
                        relatedPlace: item.relatedPlace && item.relatedPlace.label
                            ? { id: item.relatedPlace.id || '', label: String(item.relatedPlace.label) }
                            : (item.relatedPlaceLabel ? { id: '', label: String(item.relatedPlaceLabel) } : null),
                        imageKind: item.imageKind === 'photo' ? 'photo' : 'illustration',
                        illustration: item.illustration || null,
                        icon: item.icon || 'ph-gift',
                        photoDataUrl: item.photoDataUrl || null,
                        purchased: !!item.purchased,
                        createdAt: item.createdAt || new Date().toISOString()
                    }))
                };
            } catch (e) {
                souvenirState = { version: SOUVENIR_STORAGE_VERSION, items: [] };
            }
        }

        function saveSouvenirState() {
            try {
                localStorage.setItem(souvenirStorageKey(), JSON.stringify({
                    version: SOUVENIR_STORAGE_VERSION,
                    items: souvenirState.items
                }));
                return true;
            } catch (e) {
                return false;
            }
        }

        function souvenirIllustrationHtml(item, extraClass) {
            const cls = extraClass ? ' ' + extraClass : '';
            if (item.imageKind === 'photo' && item.photoDataUrl) {
                return `<button type="button" class="souvenir-thumb is-photo${cls}" data-souvenir-photo="${escapeHtml(item.id)}" aria-label="放大 ${escapeHtml(item.name)} 的商品照片"><img src="${escapeHtml(item.photoDataUrl)}" alt=""></button>`;
            }
            if (item.illustration) {
                return `<span class="souvenir-illust${cls}" aria-hidden="true"><img src="${escapeHtml(item.illustration)}" alt=""></span>`;
            }
            const icon = item.icon || 'ph-gift';
            return `<span class="souvenir-illust${cls}" aria-hidden="true"><i class="ph-duotone ${escapeHtml(icon)}"></i></span>`;
        }

        function renderSouvenirTabs() {
            const countEl = document.getElementById('souvenir-mine-count');
            const n = souvenirState.items.length;
            if (countEl) countEl.textContent = n ? '（' + n + '）' : '';
            document.querySelectorAll('[data-souvenir-view]').forEach((btn) => {
                const on = btn.dataset.souvenirView === souvenirView;
                btn.classList.toggle('is-active', on);
                btn.setAttribute('aria-selected', on ? 'true' : 'false');
            });
            const rec = document.getElementById('souvenir-panel-recommend');
            const mine = document.getElementById('souvenir-panel-mine');
            if (rec) rec.classList.toggle('hidden', souvenirView !== 'recommend');
            if (mine) mine.classList.toggle('hidden', souvenirView !== 'mine');
            const fab = document.getElementById('souvenir-fab');
            if (fab) fab.classList.toggle('hidden', currentTab !== 'souvenir' || souvenirView !== 'mine');
        }

        function renderSouvenirRecommendations() {
            const root = document.getElementById('souvenir-recommend-list');
            if (!root) return;
            const todayDay = getTokyoTodayTripDay();
            const groups = [];
            const index = {};
            SOUVENIR_RECOMMENDATIONS.forEach((rec) => {
                const key = String(rec.relatedDay) + '::' + ((rec.relatedPlace && (rec.relatedPlace.id || rec.relatedPlace.label)) || '');
                if (!index[key]) {
                    const group = {
                        day: rec.relatedDay,
                        placeId: rec.relatedPlace ? rec.relatedPlace.id : '',
                        placeLabel: rec.relatedPlace ? rec.relatedPlace.label : '',
                        items: []
                    };
                    index[key] = group;
                    groups.push(group);
                }
                index[key].items.push(rec);
            });
            groups.sort((a, b) => a.day - b.day);
            root.innerHTML = groups.map((group) => {
                const todayMark = todayDay === group.day ? '<span class="souvenir-today-pill">今日</span>' : '';
                const cards = group.items.map((rec) => {
                    const added = isRecommendationInMine(rec.id);
                    const price = formatSouvenirPrice(rec.referencePrice, rec.priceNote);
                    const locs = (rec.purchaseLocations || []).map((loc) => `<li>${escapeHtml(loc)}</li>`).join('');
                    const action = added
                        ? `<button type="button" class="btn-secondary" disabled><i class="ph ph-check" aria-hidden="true"></i> 已加入</button>`
                        : `<button type="button" class="btn-outline" data-souvenir-add-rec="${escapeHtml(rec.id)}"><i class="ph ph-plus" aria-hidden="true"></i> 加入我的手信</button>`;
                    return `
                        <article class="souvenir-rec-card">
                            ${souvenirIllustrationHtml(rec)}
                            <div class="souvenir-rec-copy">
                                <h3 class="souvenir-rec-name">${escapeHtml(rec.name)}</h3>
                                <p class="souvenir-rec-desc">${escapeHtml(rec.shortDescription)}</p>
                                ${price ? `<p class="souvenir-rec-price">${escapeHtml(price)}</p>` : ''}
                                <p class="souvenir-buy-label">購買</p>
                                <ul class="souvenir-buy-list">${locs}</ul>
                            </div>
                            <div class="souvenir-rec-actions">${action}</div>
                        </article>
                    `;
                }).join('');
                const blockId = 'souvenir-day-' + group.day + (group.placeId ? '-' + group.placeId : '');
                return `
                    <section class="souvenir-day-block page-sheet" id="${escapeHtml(blockId)}" data-souvenir-day="${group.day}">
                        <div class="souvenir-day-head">
                            <h2 class="souvenir-day-label"><span class="souvenir-day-num">Day ${group.day}</span>｜${escapeHtml(group.placeLabel)}</h2>
                            ${todayMark}
                        </div>
                        ${cards}
                    </section>
                `;
            }).join('');

            const notesRoot = document.getElementById('souvenir-notes');
            if (notesRoot) {
                notesRoot.innerHTML = `
                    <article class="page-sheet">
                        ${SOUVENIR_NOTES.map((note, i) => `
                            <div class="flex items-start gap-4 py-6${i < SOUVENIR_NOTES.length - 1 ? ' border-b border-haizakura/40' : ''}">
                                <span class="list-icon bg-ohdo/20 text-ohdo" aria-hidden="true"><i class="ph ${escapeHtml(note.icon)}"></i></span>
                                <div class="min-w-0 flex-1">
                                    <h3 class="item-title">${escapeHtml(note.title)}</h3>
                                    <p class="mt-1.5 text-sm text-secondary leading-relaxed">${escapeHtml(note.body)}</p>
                                </div>
                            </div>
                        `).join('')}
                    </article>
                `;
            }
        }

        function filteredSouvenirItems() {
            const items = souvenirState.items.slice();
            items.sort((a, b) => {
                if (a.purchased !== b.purchased) return a.purchased ? 1 : -1;
                const dayA = a.relatedDay || 99;
                const dayB = b.relatedDay || 99;
                if (dayA !== dayB) return dayA - dayB;
                return String(a.createdAt).localeCompare(String(b.createdAt));
            });
            if (souvenirFilter === 'open') return items.filter((item) => !item.purchased);
            if (souvenirFilter === 'done') return items.filter((item) => item.purchased);
            return items;
        }

        function renderSouvenirMine() {
            const root = document.getElementById('souvenir-mine-list');
            const empty = document.getElementById('souvenir-mine-empty');
            if (!root) return;
            const items = filteredSouvenirItems();
            document.querySelectorAll('[data-souvenir-filter]').forEach((btn) => {
                btn.classList.toggle('is-active', btn.dataset.souvenirFilter === souvenirFilter);
            });
            if (!souvenirState.items.length) {
                root.innerHTML = '';
                if (empty) {
                    empty.classList.remove('hidden');
                    empty.textContent = '還沒有手信。可從「推薦」加入，或自己新增要買的東西。';
                }
                return;
            }
            if (!items.length) {
                root.innerHTML = '';
                if (empty) {
                    empty.classList.remove('hidden');
                    empty.textContent = souvenirFilter === 'done' ? '還沒有已購買的手信。' : '未購買的手信都買齊了。';
                }
                return;
            }
            if (empty) empty.classList.add('hidden');
            root.innerHTML = items.map((item) => {
                const qty = item.quantity > 1 ? ' ×' + item.quantity : '';
                const brand = item.brand ? escapeHtml(item.brand) + '　' : '';
                const who = item.forWhom ? '幫' + escapeHtml(item.forWhom) + '買' : '';
                const price = formatSouvenirPrice(item.referencePrice, item.priceNote);
                const metaBits = [who, qty.trim(), price].filter(Boolean);
                const place = formatSouvenirDayPlace(item.relatedDay, item.relatedPlace && item.relatedPlace.label);
                const locs = (item.purchaseLocations || []).join('、');
                const placeLine = [place, locs].filter(Boolean).join('　');
                const note = item.note ? `<p class="souvenir-mine-note">${escapeHtml(item.note)}</p>` : '';
                const thumb = souvenirIllustrationHtml(item);
                return `
                    <article class="souvenir-mine-item${item.purchased ? ' is-done' : ''}">
                        <label class="prep-check-wrap">
                            <input type="checkbox" data-souvenir-bought="${escapeHtml(item.id)}" ${item.purchased ? 'checked' : ''} aria-label="已購買 ${escapeHtml(item.name)}">
                            <span class="prep-check" aria-hidden="true"><i class="ph ph-check"></i></span>
                        </label>
                        ${thumb}
                        <div class="souvenir-mine-body">
                            <p class="souvenir-mine-name">${brand}${escapeHtml(item.name)}</p>
                            ${metaBits.length ? `<p class="souvenir-mine-meta">${metaBits.join('　')}</p>` : ''}
                            ${placeLine ? `<p class="souvenir-mine-place">${escapeHtml(placeLine)}</p>` : ''}
                            ${note}
                        </div>
                        <div class="souvenir-mine-actions">
                            <button type="button" class="expense-icon-btn edit" data-souvenir-edit="${escapeHtml(item.id)}" aria-label="編輯 ${escapeHtml(item.name)}"><i class="ph ph-pencil-simple" aria-hidden="true"></i></button>
                            <button type="button" class="expense-icon-btn delete" data-souvenir-delete="${escapeHtml(item.id)}" aria-label="刪除 ${escapeHtml(item.name)}"><i class="ph ph-trash" aria-hidden="true"></i></button>
                        </div>
                    </article>
                `;
            }).join('');
        }

        function renderSouvenirGuide() {
            renderSouvenirTabs();
            renderSouvenirRecommendations();
            renderSouvenirMine();
        }

        function switchSouvenirView(view) {
            souvenirView = view === 'mine' ? 'mine' : 'recommend';
            renderSouvenirTabs();
            if (souvenirView === 'recommend') {
                requestAnimationFrame(scrollSouvenirTodayIntoView);
            }
        }

        function scrollSouvenirTodayIntoView() {
            const todayDay = getTokyoTodayTripDay();
            if (todayDay == null) return;
            const days = [];
            SOUVENIR_RECOMMENDATIONS.forEach((rec) => {
                if (days.indexOf(rec.relatedDay) === -1) days.push(rec.relatedDay);
            });
            days.sort((a, b) => a - b);
            const targetDay = days.find((day) => day >= todayDay) || days[days.length - 1];
            const el = document.querySelector('[data-souvenir-day="' + targetDay + '"]');
            if (el) el.scrollIntoView({ block: 'start', behavior: 'auto' });
        }

        function addRecommendationToMine(recId) {
            if (isRecommendationInMine(recId)) return;
            const rec = findSouvenirRecommendation(recId);
            if (!rec) return;
            souvenirState.items.push({
                id: 'sv-' + Date.now(),
                source: 'recommendation',
                recommendationId: rec.id,
                name: rec.name,
                brand: '',
                forWhom: '',
                quantity: 1,
                referencePrice: rec.referencePrice == null ? '' : rec.referencePrice,
                priceNote: rec.priceNote || '',
                purchaseLocations: (rec.purchaseLocations || []).slice(),
                note: rec.packageInfo || '',
                relatedDay: rec.relatedDay,
                relatedPlace: rec.relatedPlace ? { id: rec.relatedPlace.id, label: rec.relatedPlace.label } : null,
                imageKind: 'illustration',
                illustration: rec.illustration,
                icon: rec.icon,
                photoDataUrl: null,
                purchased: false,
                createdAt: new Date().toISOString()
            });
            saveSouvenirState();
            renderSouvenirGuide();
        }

        function toggleSouvenirBought(id, bought) {
            const item = findSouvenirItem(id);
            if (!item) return;
            item.purchased = !!bought;
            saveSouvenirState();
            renderSouvenirMine();
            renderSouvenirTabs();
        }

        function deleteSouvenirItem(id) {
            souvenirState.items = souvenirState.items.filter((item) => item.id !== id);
            saveSouvenirState();
            renderSouvenirGuide();
        }

        function fillSouvenirDayOptions(selected) {
            const select = document.getElementById('souvenir-day');
            if (!select) return;
            const current = selected == null || selected === '' ? '' : String(selected);
            const options = ['<option value="">不指定</option>'].concat(
                getItineraryDays().map((day) => {
                    const label = 'Day ' + day.day + '｜' + (day.heading || day.date || '');
                    return `<option value="${day.day}"${String(day.day) === current ? ' selected' : ''}>${escapeHtml(label)}</option>`;
                })
            );
            select.innerHTML = options.join('');
        }

        function resetSouvenirForm() {
            souvenirPhotoDraft = '';
            const ids = {
                'souvenir-edit-id': '',
                'souvenir-source': 'custom',
                'souvenir-rec-id': '',
                'souvenir-name': '',
                'souvenir-brand': '',
                'souvenir-for-whom': '',
                'souvenir-qty': '1',
                'souvenir-price': '',
                'souvenir-place-label': '',
                'souvenir-locations': '',
                'souvenir-note': ''
            };
            Object.keys(ids).forEach((id) => {
                const el = document.getElementById(id);
                if (el) el.value = ids[id];
            });
            fillSouvenirDayOptions('');
            const photoInput = document.getElementById('souvenir-photo-input');
            if (photoInput) photoInput.value = '';
            renderSouvenirPhotoPreview();
            const photoWrap = document.getElementById('souvenir-photo-field');
            if (photoWrap) photoWrap.classList.remove('hidden');
            const titleEl = document.getElementById('souvenir-sheet-title');
            const submitBtn = document.getElementById('souvenir-submit');
            if (titleEl) titleEl.textContent = '新增手信';
            if (submitBtn) submitBtn.textContent = '新增';
        }

        function fillSouvenirForm(item) {
            souvenirPhotoDraft = item.photoDataUrl || '';
            document.getElementById('souvenir-edit-id').value = item.id;
            document.getElementById('souvenir-source').value = item.source;
            document.getElementById('souvenir-rec-id').value = item.recommendationId || '';
            document.getElementById('souvenir-name').value = item.name || '';
            document.getElementById('souvenir-brand').value = item.brand || '';
            document.getElementById('souvenir-for-whom').value = item.forWhom || '';
            document.getElementById('souvenir-qty').value = item.quantity || 1;
            document.getElementById('souvenir-price').value = item.referencePrice == null ? '' : item.referencePrice;
            document.getElementById('souvenir-place-label').value = item.relatedPlace && item.relatedPlace.label ? item.relatedPlace.label : '';
            document.getElementById('souvenir-locations').value = locationsToText(item.purchaseLocations);
            document.getElementById('souvenir-note').value = item.note || '';
            fillSouvenirDayOptions(item.relatedDay);
            const photoInput = document.getElementById('souvenir-photo-input');
            if (photoInput) photoInput.value = '';
            const photoWrap = document.getElementById('souvenir-photo-field');
            if (photoWrap) photoWrap.classList.toggle('hidden', item.source === 'recommendation');
            renderSouvenirPhotoPreview();
            const titleEl = document.getElementById('souvenir-sheet-title');
            const submitBtn = document.getElementById('souvenir-submit');
            if (titleEl) titleEl.textContent = '編輯手信';
            if (submitBtn) submitBtn.textContent = '儲存';
        }

        function renderSouvenirPhotoPreview() {
            const preview = document.getElementById('souvenir-photo-preview');
            if (!preview) return;
            if (!souvenirPhotoDraft) {
                preview.innerHTML = '<span class="text-secondary">尚未加入照片</span>';
                return;
            }
            preview.innerHTML = `
                <span class="souvenir-thumb is-photo"><img src="${escapeHtml(souvenirPhotoDraft)}" alt=""></span>
                <button type="button" class="btn-secondary" data-souvenir-clear-photo>移除照片</button>
            `;
        }

        function closeSouvenirSheet() {
            const sheet = document.getElementById('souvenir-sheet');
            if (!sheet || !sheet.classList.contains('is-open')) return;
            sheet.classList.remove('is-open');
            document.body.classList.remove('souvenir-sheet-open');
            sheet.setAttribute('aria-hidden', 'true');
            if (souvenirSheetLastFocus) {
                souvenirSheetLastFocus.focus();
                souvenirSheetLastFocus = null;
            }
        }

        function openSouvenirSheet(itemId) {
            closeItinSheet();
            closeExpenseSheet();
            closeSouvenirPhoto();
            const sheet = document.getElementById('souvenir-sheet');
            if (!sheet) return;
            if (itemId) {
                const item = findSouvenirItem(itemId);
                if (!item) return;
                fillSouvenirForm(item);
            } else {
                resetSouvenirForm();
            }
            souvenirSheetLastFocus = document.activeElement;
            sheet.classList.add('is-open');
            document.body.classList.add('souvenir-sheet-open');
            sheet.setAttribute('aria-hidden', 'false');
            const nameInput = document.getElementById('souvenir-name');
            if (nameInput) nameInput.focus();
        }

        function closeSouvenirPhoto() {
            const overlay = document.getElementById('souvenir-photo');
            if (!overlay || !overlay.classList.contains('is-open')) return;
            overlay.classList.remove('is-open');
            document.body.classList.remove('souvenir-photo-open');
            overlay.setAttribute('aria-hidden', 'true');
            const img = document.getElementById('souvenir-photo-img');
            if (img) img.removeAttribute('src');
        }

        function openSouvenirPhoto(itemId) {
            const item = findSouvenirItem(itemId);
            if (!item || !item.photoDataUrl) return;
            const overlay = document.getElementById('souvenir-photo');
            const img = document.getElementById('souvenir-photo-img');
            if (!overlay || !img) return;
            img.src = item.photoDataUrl;
            img.alt = item.name + ' 商品照片';
            overlay.classList.add('is-open');
            document.body.classList.add('souvenir-photo-open');
            overlay.setAttribute('aria-hidden', 'false');
        }

        function compressImageFile(file) {
            return new Promise((resolve, reject) => {
                if (!file || !file.type || file.type.indexOf('image/') !== 0) {
                    reject(new Error('not-image'));
                    return;
                }
                const img = new Image();
                const url = URL.createObjectURL(file);
                img.onload = () => {
                    const max = 1200;
                    const scale = Math.min(1, max / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/jpeg', 0.72));
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    reject(new Error('load'));
                };
                img.src = url;
            });
        }

        function collectSouvenirForm() {
            const name = (document.getElementById('souvenir-name').value || '').trim();
            const source = document.getElementById('souvenir-source').value || 'custom';
            const recId = document.getElementById('souvenir-rec-id').value || null;
            const dayVal = document.getElementById('souvenir-day').value;
            const placeLabel = (document.getElementById('souvenir-place-label').value || '').trim();
            const priceVal = (document.getElementById('souvenir-price').value || '').trim();
            return {
                name,
                source,
                recommendationId: recId,
                brand: (document.getElementById('souvenir-brand').value || '').trim(),
                forWhom: (document.getElementById('souvenir-for-whom').value || '').trim(),
                quantity: Math.max(1, Number(document.getElementById('souvenir-qty').value) || 1),
                referencePrice: priceVal === '' ? '' : Number(priceVal),
                purchaseLocations: textToLocations(document.getElementById('souvenir-locations').value),
                note: (document.getElementById('souvenir-note').value || '').trim(),
                relatedDay: dayVal ? Number(dayVal) : null,
                relatedPlace: placeLabel ? { id: '', label: placeLabel } : null
            };
        }

        function submitSouvenirForm() {
            const data = collectSouvenirForm();
            if (!data.name) {
                const nameInput = document.getElementById('souvenir-name');
                if (nameInput) nameInput.focus();
                return;
            }
            const editId = document.getElementById('souvenir-edit-id').value;
            if (editId) {
                const item = findSouvenirItem(editId);
                if (!item) return;
                const prevPlaceId = item.relatedPlace && item.relatedPlace.id ? item.relatedPlace.id : '';
                const prevPriceNote = item.priceNote || '';
                Object.assign(item, data);
                if (item.relatedPlace) item.relatedPlace.id = prevPlaceId;
                item.priceNote = prevPriceNote;
                if (item.source === 'custom') {
                    item.imageKind = souvenirPhotoDraft ? 'photo' : 'illustration';
                    item.photoDataUrl = souvenirPhotoDraft || null;
                    if (!item.icon) item.icon = 'ph-gift';
                }
            } else {
                souvenirState.items.push({
                    id: 'sv-' + Date.now(),
                    source: 'custom',
                    recommendationId: null,
                    name: data.name,
                    brand: data.brand,
                    forWhom: data.forWhom,
                    quantity: data.quantity,
                    referencePrice: data.referencePrice,
                    priceNote: '',
                    purchaseLocations: data.purchaseLocations,
                    note: data.note,
                    relatedDay: data.relatedDay,
                    relatedPlace: data.relatedPlace,
                    imageKind: souvenirPhotoDraft ? 'photo' : 'illustration',
                    illustration: null,
                    icon: 'ph-gift',
                    photoDataUrl: souvenirPhotoDraft || null,
                    purchased: false,
                    createdAt: new Date().toISOString()
                });
            }
            const saved = saveSouvenirState();
            if (!saved && souvenirPhotoDraft) {
                const last = editId ? findSouvenirItem(editId) : souvenirState.items[souvenirState.items.length - 1];
                if (last) {
                    last.photoDataUrl = null;
                    last.imageKind = last.source === 'recommendation' ? 'illustration' : 'illustration';
                    saveSouvenirState();
                }
            }
            closeSouvenirSheet();
            switchSouvenirView('mine');
            renderSouvenirGuide();
        }

        function bindSouvenirUi() {
            const root = document.getElementById('content-souvenir');
            if (root && root.dataset.souvenirBound !== '1') {
                root.dataset.souvenirBound = '1';
                root.addEventListener('click', (event) => {
                    const tab = event.target.closest('[data-souvenir-view]');
                    if (tab) {
                        switchSouvenirView(tab.dataset.souvenirView);
                        return;
                    }
                    const filterBtn = event.target.closest('[data-souvenir-filter]');
                    if (filterBtn) {
                        souvenirFilter = filterBtn.dataset.souvenirFilter;
                        renderSouvenirMine();
                        return;
                    }
                    const addRec = event.target.closest('[data-souvenir-add-rec]');
                    if (addRec) {
                        addRecommendationToMine(addRec.dataset.souvenirAddRec);
                        return;
                    }
                    const addBtn = event.target.closest('[data-souvenir-add]');
                    if (addBtn) {
                        openSouvenirSheet();
                        return;
                    }
                    const editBtn = event.target.closest('[data-souvenir-edit]');
                    if (editBtn) {
                        openSouvenirSheet(editBtn.dataset.souvenirEdit);
                        return;
                    }
                    const delBtn = event.target.closest('[data-souvenir-delete]');
                    if (delBtn) {
                        deleteSouvenirItem(delBtn.dataset.souvenirDelete);
                        return;
                    }
                    const photoBtn = event.target.closest('[data-souvenir-photo]');
                    if (photoBtn) {
                        openSouvenirPhoto(photoBtn.dataset.souvenirPhoto);
                    }
                });
                root.addEventListener('change', (event) => {
                    const box = event.target.closest('[data-souvenir-bought]');
                    if (!box) return;
                    toggleSouvenirBought(box.dataset.souvenirBought, box.checked);
                });
            }

            const form = document.getElementById('souvenir-form');
            if (form && form.dataset.souvenirBound !== '1') {
                form.dataset.souvenirBound = '1';
                form.addEventListener('submit', (event) => {
                    event.preventDefault();
                    submitSouvenirForm();
                });
                form.addEventListener('click', (event) => {
                    if (event.target.closest('[data-souvenir-clear-photo]')) {
                        souvenirPhotoDraft = '';
                        const photoInput = document.getElementById('souvenir-photo-input');
                        if (photoInput) photoInput.value = '';
                        renderSouvenirPhotoPreview();
                    }
                });
                const photoInput = document.getElementById('souvenir-photo-input');
                if (photoInput) {
                    photoInput.addEventListener('change', (event) => {
                        const file = event.target.files && event.target.files[0];
                        if (!file) return;
                        compressImageFile(file).then((dataUrl) => {
                            souvenirPhotoDraft = dataUrl;
                            renderSouvenirPhotoPreview();
                        }).catch(() => {
                            souvenirPhotoDraft = '';
                            renderSouvenirPhotoPreview();
                        });
                    });
                }
            }

            const photo = document.getElementById('souvenir-photo');
            if (photo && photo.dataset.souvenirBound !== '1') {
                photo.dataset.souvenirBound = '1';
                photo.addEventListener('click', (event) => {
                    if (event.target === photo || event.target.closest('[data-souvenir-photo-close]')) {
                        closeSouvenirPhoto();
                    }
                });
            }

            const fab = document.getElementById('souvenir-fab');
            if (fab && fab.dataset.souvenirBound !== '1') {
                fab.dataset.souvenirBound = '1';
                fab.addEventListener('click', () => openSouvenirSheet());
            }
        }

        function initSouvenirGuide() {
            loadSouvenirState();
            renderSouvenirGuide();
            bindSouvenirUi();
        }

        function getPlace(id) {
            return PLACES.find((place) => place.id === id) || null;
        }

        function formatTripMd(iso) {
            const parts = String(iso || '').split('-');
            if (parts.length < 3) return '';
            return parts[1] + '/' + parts[2];
        }

        function nightsBetween(checkIn, checkOut) {
            const start = Date.parse(checkIn + 'T00:00:00');
            const end = Date.parse(checkOut + 'T00:00:00');
            if (Number.isNaN(start) || Number.isNaN(end) || end <= start) return 0;
            return Math.round((end - start) / 86400000);
        }

        function mapsSearchUrl(query) {
            return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(query);
        }

        function overviewMetaRow(label, valueHtml) {
            if (!valueHtml) return '';
            return `<p><span class="overview-label">${escapeHtml(label)}</span>${valueHtml}</p>`;
        }

        function renderOverviewRoute() {
            const root = document.getElementById('overview-route');
            if (!root) return;
            root.innerHTML = TRIP_ROUTE.map((stop) => `
                <div class="overview-stop${stop.kind === 'fly' ? ' is-fly' : ''}">
                    <p class="overview-stop-name">${escapeHtml(stop.name)}</p>
                    ${stop.meta ? `<p class="overview-stop-meta">${escapeHtml(stop.meta)}</p>` : ''}
                </div>
            `).join('');
        }

        function renderOverviewFlights() {
            const root = document.getElementById('overview-flights');
            if (!root) return;
            const flightBooking = BOOKINGS.find((item) => item.type === 'flight');
            const segments = flightBooking
                ? FLIGHT_SEGMENTS.filter((seg) => (flightBooking.segmentIds || []).includes(seg.id) || seg.bookingId === flightBooking.id)
                : FLIGHT_SEGMENTS.slice();
            root.innerHTML = segments.map((seg) => {
                const depCode = [seg.departure.airportCode, seg.departure.terminal].filter(Boolean).join(' ');
                const arrCode = [seg.arrival.airportCode, seg.arrival.terminal].filter(Boolean).join(' ');
                const depWhen = [formatTripMd(seg.date), seg.departure.time].filter(Boolean).join(' ');
                const arrWhen = [formatTripMd(seg.date), seg.arrival.time].filter(Boolean).join(' ');
                return `
                    <div class="overview-flight">
                        <p class="overview-flight-kicker">${escapeHtml(seg.directionLabel || '')}</p>
                        <p class="overview-flight-no">${escapeHtml(seg.flightNo)}</p>
                        <div class="overview-flight-route">
                            <p class="overview-flight-code">${escapeHtml(depCode)}</p>
                            <i class="ph-fill ph-airplane overview-flight-plane" aria-hidden="true"></i>
                            <p class="overview-flight-code is-arr">${escapeHtml(arrCode)}</p>
                            <p class="overview-flight-when">${escapeHtml(depWhen)}</p>
                            <span></span>
                            <p class="overview-flight-when is-arr">${escapeHtml(arrWhen)}</p>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderOverviewStays() {
            const root = document.getElementById('overview-stays');
            if (!root) return;
            const stays = BOOKINGS.filter((item) => item.type === 'accommodation');
            root.innerHTML = stays.map((booking) => {
                const place = getPlace(booking.placeId) || {};
                const nights = nightsBetween(booking.checkIn, booking.checkOut);
                const when = [formatTripMd(booking.checkIn), formatTripMd(booking.checkOut)].filter(Boolean).join('–')
                    + (nights ? ` · ${nights} 晚` : '');
                const phoneHtml = place.phone
                    ? `<a href="tel:${escapeHtml(place.tel || place.phone)}">${escapeHtml(place.phone)}</a>`
                    : '';
                const addressHtml = place.address ? `<span>${escapeHtml(place.address)}</span>` : '';
                const emailHtml = place.email
                    ? `<a href="mailto:${escapeHtml(place.email)}">${escapeHtml(place.email)}</a>`
                    : '';
                const bookingNo = booking.confirmationNo
                    ? `<p class="overview-booking-no">Booking #${escapeHtml(booking.confirmationNo)}</p>`
                    : '';
                const mapHtml = place.mapQuery
                    ? `<a href="${escapeHtml(mapsSearchUrl(place.mapQuery))}" target="_blank" rel="noopener" class="btn-outline is-quiet"><i class="ph ph-map-pin" aria-hidden="true"></i> 地圖</a>`
                    : '';
                const siteHtml = place.website
                    ? `<a href="${escapeHtml(place.website)}" target="_blank" rel="noopener" class="btn-outline is-quiet"><i class="ph ph-globe" aria-hidden="true"></i> 官網</a>`
                    : '';
                const detailRows = [];
                if (booking.plan) detailRows.push(overviewMetaRow('プラン', `<span>${escapeHtml(booking.plan)}</span>`));
                if (booking.room) detailRows.push(overviewMetaRow('お部屋', `<span>${escapeHtml(booking.room)}</span>`));
                if (booking.meals) detailRows.push(overviewMetaRow('お食事', `<span>${escapeHtml(booking.meals)}</span>`));
                if (booking.checkoutTime) detailRows.push(overviewMetaRow('チェックアウト', `<span>${escapeHtml(booking.checkoutTime)}</span>`));
                if (booking.rooms) detailRows.push(overviewMetaRow('部屋数', `<span>${escapeHtml(booking.rooms)}</span>`));
                if (booking.occupancy) detailRows.push(overviewMetaRow('部屋割り', `<span>${escapeHtml(booking.occupancy)}</span>`));
                if (booking.bookedAt) detailRows.push(overviewMetaRow('予約受付', `<span>${escapeHtml(booking.bookedAt)}</span>`));
                const detailsHtml = detailRows.length
                    ? `<details class="quiet-details overview-booking">
                            <summary class="btn-outline is-quiet">
                                <i class="ph ph-ticket" aria-hidden="true"></i> 訂房明細
                            </summary>
                            <div class="overview-booking-body">${detailRows.join('')}</div>
                        </details>`
                    : '';
                return `
                    <div class="overview-hotel">
                        <p class="overview-hotel-when">${escapeHtml(when)}</p>
                        <h3 class="overview-hotel-name">${escapeHtml(place.name || '')}</h3>
                        <div class="overview-hotel-meta">
                            ${overviewMetaRow('電話', phoneHtml)}
                            ${overviewMetaRow('地址', addressHtml)}
                            ${overviewMetaRow('Email', emailHtml)}
                        </div>
                        ${bookingNo}
                        <div class="overview-hotel-actions">
                            ${mapHtml}
                            ${siteHtml}
                            ${detailsHtml}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function renderOverviewReservations() {
            const root = document.getElementById('overview-reservations');
            if (!root) return;
            const items = BOOKINGS
                .filter((item) => item.type !== 'flight' && item.type !== 'accommodation')
                .slice()
                .sort((a, b) => String(a.date).localeCompare(String(b.date)));
            root.innerHTML = items.map((booking) => {
                const place = getPlace(booking.placeId) || {};
                const phone = place.phone || booking.phone;
                const tel = place.tel || booking.tel || phone;
                const phoneHtml = phone ? `<a href="tel:${escapeHtml(tel)}">${escapeHtml(phone)}</a>` : '';
                const bookingNo = booking.confirmationNo
                    ? `<p class="overview-booking-no">Booking #${escapeHtml(booking.confirmationNo)}</p>`
                    : '';
                const channelHtml = booking.channelLabel
                    ? (booking.href
                        ? `<a href="${escapeHtml(booking.href)}" target="_blank" rel="noopener">${escapeHtml(booking.channelLabel)}</a>`
                        : `<span>${escapeHtml(booking.channelLabel)}</span>`)
                    : '';
                const summaryHtml = booking.summary ? `<span>${escapeHtml(booking.summary)}</span>` : '';
                return `
                    <div class="overview-reserve">
                        <p class="overview-reserve-when">${escapeHtml(formatTripMd(booking.date))}</p>
                        <h3 class="overview-reserve-name">${escapeHtml(booking.title || place.name || '')}</h3>
                        <div class="overview-reserve-meta">
                            ${overviewMetaRow('預約', channelHtml)}
                            ${overviewMetaRow('電話', phoneHtml)}
                            ${overviewMetaRow('內容', summaryHtml)}
                        </div>
                        ${bookingNo}
                    </div>
                `;
            }).join('');
        }

        function renderOverview() {
            renderOverviewRoute();
            renderOverviewFlights();
            renderOverviewStays();
            renderOverviewReservations();
        }

        document.addEventListener('DOMContentLoaded', () => {
            initExpenses();
            initPrepChecklist();
            initSouvenirGuide();
            renderOverview();
            renderItinerary();
            initDefaultDay();
            syncMobileNavSpace();

            const nav = document.getElementById('mobile-nav');
            if (nav && 'ResizeObserver' in window) {
                new ResizeObserver(syncMobileNavSpace).observe(nav);
            }
            window.addEventListener('resize', syncMobileNavSpace);

            document.addEventListener('click', (event) => {
                const openBtn = event.target.closest('[data-itin-sheet]');
                if (openBtn) {
                    event.preventDefault();
                    openItinSheet(openBtn);
                    return;
                }
                if (event.target.closest('[data-itin-sheet-close]')) {
                    closeItinSheet();
                    return;
                }
                if (event.target.closest('[data-expense-sheet-close]')) {
                    closeExpenseSheet();
                    return;
                }
                if (event.target.closest('[data-souvenir-sheet-close]')) {
                    closeSouvenirSheet();
                    return;
                }
                if (event.target.closest('[data-souvenir-photo-close]')) {
                    closeSouvenirPhoto();
                }
            });
            document.addEventListener('keydown', (event) => {
                if (event.key !== 'Escape') return;
                closeItinSheet();
                closeExpenseSheet();
                closeSouvenirSheet();
                closeSouvenirPhoto();
            });
        });
    </script>
</body>
